<!DOCTYPE html>
<html lang="en">
<head>
  <link rel="icon" type="image/png" href="faeblette-bird.png" />
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>the field notes — faeblette</title>
  <meta name="description" content="Essays on making, noticing, and becoming. Field notes by Crystal St. John of Faeblette." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,500;1,400&family=Libre+Baskerville:ital,wght@0,400;0,700;1,400&family=Courier+Prime&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body { background: #F0E8DA; font-family: 'Libre Baskerville', Georgia, serif; color: #26201A; -webkit-font-smoothing: antialiased; padding-bottom: 5rem; }
    .fb-wrap { max-width: 1400px; margin: 0 auto; }

    /* NAV */
    .fb-nav { display: flex; justify-content: space-between; align-items: center; padding: 2rem 3rem; }
    .fb-nav-bird img { height: 40px; width: auto; filter: brightness(0) saturate(100%) invert(13%) sepia(10%) saturate(800%) hue-rotate(10deg) brightness(95%); opacity: 1; }
    .fb-nav-links { display: flex; gap: 2.2rem; align-items: center; }
    .fb-nav-links a { font-family: 'Courier Prime', monospace; font-size: 13px; letter-spacing: 0.14em; color: #8A7660; text-decoration: none; text-transform: lowercase; }
    .fb-nav-links a:hover { color: #26201A; }

    /* PAGE HEADER */
    .fb-page-header { margin: 0 3rem 3rem; }
    .fb-page-eyebrow { font-family: 'Courier Prime', monospace; font-size: 11px; letter-spacing: 0.18em; color: #A8917A; text-transform: lowercase; margin-bottom: 0.6rem; }
    .fb-page-title { font-family: 'Playfair Display', serif; font-size: 48px; font-weight: 400; color: #26201A; line-height: 1.1; }

    /* BENTO GRID */
    .fb-grid { margin: 0 3rem; display: flex; flex-direction: column; gap: 1rem; }

    /* FEATURED — full width */
    .fb-card-featured {
      position: relative;
      width: 100%;
      height: 420px;
      border-radius: 6px;
      overflow: hidden;
      text-decoration: none;
      display: block;
      background: #2A1F16;
    }
    .fb-card-featured:hover .fb-card-img { transform: scale(1.03); }

    /* PAIR ROW */
    .fb-card-row { display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; }

    /* STANDARD CARD */
    .fb-card {
      position: relative;
      height: 300px;
      border-radius: 6px;
      overflow: hidden;
      text-decoration: none;
      display: block;
      background: #2A1F16;
    }
    .fb-card:hover .fb-card-img { transform: scale(1.03); }

    /* SHARED CARD INTERNALS */
    .fb-card-img {
      position: absolute; inset: 0;
      width: 100%; height: 100%;
      object-fit: cover;
      transition: transform 0.5s ease;
    }
    .fb-card-overlay {
      position: absolute; inset: 0;
      background: linear-gradient(to top, rgba(20,12,6,0.82) 0%, rgba(20,12,6,0.25) 55%, transparent 100%);
    }
    .fb-card-no-image {
      position: absolute; inset: 0;
      background: linear-gradient(135deg, #3A2A1C 0%, #2A1F16 100%);
    }
    .fb-card-content {
      position: absolute;
      bottom: 0; left: 0; right: 0;
      padding: 2rem;
      z-index: 2;
    }
    .fb-card-tag {
      font-family: 'Courier Prime', monospace;
      font-size: 10px;
      letter-spacing: 0.18em;
      color: rgba(240,232,218,0.55);
      text-transform: lowercase;
      margin-bottom: 6px;
      display: block;
    }
    .fb-card-title {
      font-family: 'Playfair Display', serif;
      font-weight: 400;
      color: rgba(240,232,218,0.95);
      line-height: 1.2;
    }
    .fb-card-featured .fb-card-title { font-size: 34px; max-width: 640px; }
    .fb-card .fb-card-title { font-size: 24px; }

    .fb-card-date {
      font-family: 'Courier Prime', monospace;
      font-size: 10px;
      letter-spacing: 0.14em;
      color: rgba(240,232,218,0.4);
      text-transform: lowercase;
      margin-top: 8px;
      display: block;
    }

    /* FOOTER */
    .fb-footer { margin: 4rem 3rem 0; border-top: 0.5px solid #C4B09A; padding: 2.5rem 0; display: grid; grid-template-columns: 1.5fr 1fr 1fr; gap: 3rem; align-items: start; }
    .fb-footer-name { font-family: 'Playfair Display', serif; font-size: 54px; font-weight: 400; line-height: 1.0; color: #26201A; letter-spacing: 0.02em; margin-bottom: 0.9rem; }
    .fb-footer-sub { font-family: 'Courier Prime', monospace; font-size: 11px; letter-spacing: 0.14em; color: #B0977E; text-transform: lowercase; }
    .fb-footer-links { display: flex; flex-direction: column; gap: 10px; }
    .fb-footer-links a { font-family: 'Courier Prime', monospace; font-size: 12px; letter-spacing: 0.12em; color: #8A7660; text-decoration: none; text-transform: lowercase; }
    .fb-footer-tagline { font-family: 'Libre Baskerville', serif; font-size: 14px; font-style: italic; color: #A8917A; line-height: 1.8; }
    .fb-footer-bottom { margin: 0 3rem; padding: 1.5rem 0 0; border-top: 0.5px solid #C4B09A; display: flex; justify-content: space-between; }
    .fb-footer-bottom-text { font-family: 'Courier Prime', monospace; font-size: 10px; letter-spacing: 0.12em; color: #C4B09A; text-transform: lowercase; }

    @media (max-width: 768px) {
      .fb-nav { padding: 1.5rem; flex-wrap: wrap; gap: 1rem; }
      .fb-nav-bird img { height: 22px; }
      .fb-nav-links { gap: 1.2rem; flex-wrap: wrap; }
      .fb-nav-links a { font-size: 11px; }
      .fb-page-header { margin: 0 1.5rem 2rem; }
      .fb-page-title { font-size: 36px; }
      .fb-grid { margin: 0 1.5rem; }
      .fb-card-featured { height: 300px; }
      .fb-card-featured .fb-card-title { font-size: 26px; }
      .fb-card-row { grid-template-columns: 1fr; }
      .fb-card { height: 260px; }
      .fb-footer { margin: 3rem 1.5rem 0; grid-template-columns: 1fr; gap: 2rem; }
      .fb-footer-name { font-size: 42px; }
      .fb-footer-bottom { margin: 0 1.5rem; flex-direction: column; gap: 0.5rem; }
    }
    @media (max-width: 480px) {
      .fb-page-header { margin: 0 1.2rem 1.5rem; }
      .fb-page-title { font-size: 30px; }
      .fb-grid { margin: 0 1.2rem; }
      .fb-card-featured { height: 260px; }
      .fb-card-featured .fb-card-title { font-size: 22px; }
      .fb-footer { margin: 2.5rem 1.2rem 0; }
      .fb-footer-name { font-size: 36px; }
      .fb-footer-bottom { margin: 0 1.2rem; }
    }
  </style>
</head>
<body>

<div class="fb-wrap">

  <nav class="fb-nav">
    <div class="fb-nav-bird">
      <a href="index.html"><img src="faeblette-bird.png" alt="faeblette" /></a>
    </div>
    <div class="fb-nav-links">
      <a href="index.html#field-notes">the field notes</a>
      <a href="index.html#films">films</a>
      <a href="index.html#shop">shop</a>
      <a href="about.html">about</a>
    </div>
  </nav>

  <div class="fb-page-header">
    <div class="fb-page-eyebrow">on making, noticing, and becoming</div>
    <h1 class="fb-page-title">the field notes</h1>
  </div>

  <div class="fb-grid" id="fb-grid">
    <!-- populated by script -->
  </div>

  <div class="fb-footer">
    <div>
      <div class="fb-footer-name">faeblette</div>
      <div class="fb-footer-sub">est. 2025 — los angeles, ca</div>
    </div>
    <div class="fb-footer-links">
      <a href="index.html#field-notes">the field notes</a>
      <a href="index.html#films">films</a>
      <a href="https://etsy.com/shop/TheFaebletteShop" target="_blank">the faeblette shop</a>
      <a href="about.html">about</a>
      <a href="https://www.instagram.com/faeblette_" target="_blank">instagram</a>
      <a href="https://www.youtube.com/@faeblette" target="_blank">youtube</a>
      <a href="https://www.tiktok.com/@faeblette" target="_blank">tiktok</a>
    </div>
    <div class="fb-footer-tagline">
      little lights that guide us home.
    </div>
  </div>
  <div class="fb-footer-bottom">
    <span class="fb-footer-bottom-text">&#169; 2026 faeblette — all rights reserved</span>
    <span class="fb-footer-bottom-text">faeblette.com</span>
  </div>

</div>

<script>
  async function loadNotes() {
    try {
      const res = await fetch('field-notes.json');
      const notes = await res.json();
      const grid = document.getElementById('fb-grid');

      function cardInner(note, featured) {
        const imgEl = note.image
          ? `<img class="fb-card-img" src="${note.image}" alt="${note.title}" />`
          : `<div class="fb-card-no-image"></div>`;
        return `
          ${imgEl}
          <div class="fb-card-overlay"></div>
          <div class="fb-card-content">
            <span class="fb-card-tag">${note.tag}</span>
            <div class="fb-card-title">${note.title}</div>
            <span class="fb-card-date">${note.date}</span>
          </div>`;
      }

      let html = '';
      const noteUrl = n => `notes/${n.url}`;

      // First note — featured full width
      if (notes.length > 0) {
        html += `<a class="fb-card-featured" href="${noteUrl(notes[0])}">${cardInner(notes[0], true)}</a>`;
      }

      // Remaining notes — pairs
      for (let i = 1; i < notes.length; i += 2) {
        html += `<div class="fb-card-row">`;
        html += `<a class="fb-card" href="${noteUrl(notes[i])}">${cardInner(notes[i], false)}</a>`;
        if (notes[i + 1]) {
          html += `<a class="fb-card" href="${noteUrl(notes[i + 1])}">${cardInner(notes[i + 1], false)}</a>`;
        }
        html += `</div>`;
      }

      grid.innerHTML = html;

    } catch(e) {
      console.error('Could not load field notes:', e);
    }
  }

  loadNotes();
</script>

</body>
</html>
